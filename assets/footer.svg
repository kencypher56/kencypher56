<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 180" width="1000" height="180" role="img" aria-label="Thanks for scrolling - connection closed">
  <title>connection closed cleanly</title>
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#05070d"/>
      <stop offset="100%" stop-color="#0b1220"/>
    </linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5a0" stop-opacity=".55"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity=".55"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity=".55"/>
    </linearGradient>
    <linearGradient id="wave2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#818cf8" stop-opacity=".35"/>
      <stop offset="50%" stop-color="#f472b6" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#00e5a0" stop-opacity=".35"/>
    </linearGradient>
    <clipPath id="ff"><rect width="1000" height="180" rx="16"/></clipPath>
    <style>
      .m { font-family:"JetBrains Mono","Fira Code",Consolas,"Courier New",monospace; }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cur { animation: blink 1.05s steps(1) infinite; }
    </style>
  </defs>
  <g clip-path="url(#ff)">
    <rect width="1000" height="180" fill="url(#fbg)"/>

    <g>
      <path fill="url(#wave1)" d="M-360 118 C -240 88, -120 148, 0 118 C 120 88, 240 148, 360 118 C 480 88, 600 148, 720 118 C 840 88, 960 148, 1080 118 C 1200 88, 1320 148, 1440 118 L1440 180 L-360 180 Z">
        <animateTransform attributeName="transform" type="translate" values="0,0;-360,0" dur="9s" repeatCount="indefinite"/>
      </path>
      <path fill="url(#wave2)" d="M-360 138 C -240 112, -120 164, 0 138 C 120 112, 240 164, 360 138 C 480 112, 600 164, 720 138 C 840 112, 960 164, 1080 138 C 1200 112, 1320 164, 1440 138 L1440 180 L-360 180 Z">
        <animateTransform attributeName="transform" type="translate" values="-360,0;0,0" dur="12s" repeatCount="indefinite"/>
      </path>
    </g>

    <g class="m">
      <text x="500" y="58" text-anchor="middle" font-size="19" fill="#e6edf3">Thanks for scrolling &#8212; now go automate something.</text>
      <text x="500" y="88" text-anchor="middle" font-size="13.5" fill="#5b6b86">
        <tspan fill="#00e5a0">kencypher@homelab</tspan><tspan>:</tspan><tspan fill="#22d3ee">~</tspan><tspan>$ </tspan><tspan fill="#9fb3c8">exit</tspan>
      </text>
      <rect x="596" y="76" width="8" height="15" fill="#00e5a0" class="cur"/>
    </g>

    <g>
      <circle cx="60" cy="40" r="2" fill="#22d3ee"><animate attributeName="opacity" values=".2;1;.2" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="140" cy="24" r="1.6" fill="#00e5a0"><animate attributeName="opacity" values=".2;1;.2" dur="4.2s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="46" r="2" fill="#818cf8"><animate attributeName="opacity" values=".2;1;.2" dur="3.6s" repeatCount="indefinite"/></circle>
      <circle cx="820" cy="26" r="1.6" fill="#f472b6"><animate attributeName="opacity" values=".2;1;.2" dur="5s" repeatCount="indefinite"/></circle>
    </g>

    <rect width="1000" height="180" rx="16" fill="none" stroke="#1f2b3d" stroke-width="1.5"/>
  </g>
</svg>
