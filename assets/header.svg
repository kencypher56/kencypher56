<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="Kencypher - DevOps, System Administration, Automation, Penetration Testing">
  <title>Kencypher - DevOps / SysAdmin / Automation / Pentesting</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="50%" stop-color="#10131c"/>
      <stop offset="100%" stop-color="#08090f"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f0cd7a"/>
      <stop offset="38%" stop-color="#d64358"/>
      <stop offset="72%" stop-color="#7ea8e8"/>
      <stop offset="100%" stop-color="#00e5ff"/>
      <animate attributeName="x1" values="0;0.6;0" dur="9s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="1;1.6;1" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#00e5ff" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#00e5ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glowOrb" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#f0cd7a" stop-opacity="0.32"/>
      <stop offset="100%" stop-color="#f0cd7a" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowOrb2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8fb4ee" stop-opacity="0.30"/>
      <stop offset="100%" stop-color="#8fb4ee" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="tight" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="frame"><rect x="0" y="0" width="1000" height="300" rx="18"/></clipPath>
    <clipPath id="reveal">
      <rect x="58" y="194" width="0" height="36">
        <animate attributeName="width" values="0;0;600;600;0" keyTimes="0;0.06;0.45;0.9;1" dur="11s" repeatCount="indefinite"/>
      </rect>
    </clipPath>
    <style>
      .mono { font-family: "JetBrains Mono","Cascadia Code","Fira Code","SF Mono",Consolas,"DejaVu Sans Mono",monospace; }
      .rain { fill:#f0cd7a; opacity:.22; font-size:13px; }
      .pill { font-size:11.5px; letter-spacing:1.2px; font-weight:600; }
      .kv   { fill:#8b94a6; font-size:12.5px; }
      .sub  { fill:#d5cfc2; font-size:16px; letter-spacing:.4px; }
      @keyframes flick { 0%,100%{opacity:1} 45%{opacity:.62} 50%{opacity:1} 92%{opacity:.76} }
      @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
      .cursor { animation: blink 1s steps(1) infinite; }
      .title  { animation: flick 7s ease-in-out infinite; }
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1000" height="300" fill="url(#bg)"/>

    <circle cx="140" cy="70" r="205" fill="url(#glowOrb)">
      <animate attributeName="cy" values="70;120;70" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle cx="880" cy="240" r="225" fill="url(#glowOrb2)">
      <animate attributeName="cy" values="240;190;240" dur="14s" repeatCount="indefinite"/>
    </circle>

    <g stroke="#232a3a" stroke-width=".6" opacity=".42">
      <path d="M0 60H1000M0 110H1000M0 160H1000M0 210H1000M0 260H1000"/>
      <path d="M60 0V300M160 0V300M260 0V300M360 0V300M460 0V300M560 0V300M660 0V300M760 0V300M860 0V300M960 0V300"/>
    </g>

    <g class="mono rain">
      <text x="34" y="-10">1<tspan x="34" dy="18">0</tspan><tspan x="34" dy="18">1</tspan><tspan x="34" dy="18">1</tspan><tspan x="34" dy="18">0</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-40;0,360" dur="6s" repeatCount="indefinite"/></text>
      <text x="212" y="-40">0<tspan x="212" dy="18">1</tspan><tspan x="212" dy="18">1</tspan><tspan x="212" dy="18">0</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-20;0,380" dur="8.5s" repeatCount="indefinite"/></text>
      <text x="410" y="-70">1<tspan x="410" dy="18">1</tspan><tspan x="410" dy="18">0</tspan><tspan x="410" dy="18">1</tspan><tspan x="410" dy="18">0</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-30;0,370" dur="7.2s" repeatCount="indefinite"/></text>
      <text x="648" y="-20">0<tspan x="648" dy="18">0</tspan><tspan x="648" dy="18">1</tspan><tspan x="648" dy="18">1</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-60;0,340" dur="9.4s" repeatCount="indefinite"/></text>
      <text x="806" y="-50">1<tspan x="806" dy="18">0</tspan><tspan x="806" dy="18">0</tspan><tspan x="806" dy="18">1</tspan><tspan x="806" dy="18">1</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-10;0,390" dur="6.8s" repeatCount="indefinite"/></text>
      <text x="944" y="-30">0<tspan x="944" dy="18">1</tspan><tspan x="944" dy="18">0</tspan>
        <animateTransform attributeName="transform" type="translate" values="0,-50;0,350" dur="10.1s" repeatCount="indefinite"/></text>
    </g>

    <rect x="-320" y="0" width="320" height="300" fill="url(#sweep)" opacity=".55">
      <animate attributeName="x" values="-320;1000" dur="6.5s" repeatCount="indefinite"/>
    </rect>

    <g class="mono">
      <text x="58" y="72" font-size="14" font-weight="500"><tspan fill="#f0cd7a">root@kencypher</tspan><tspan fill="#7a8497">:</tspan><tspan fill="#00e5ff">~</tspan><tspan fill="#7a8497">$ </tspan><tspan fill="#f5f1e8">whoami</tspan><tspan fill="#f0cd7a" class="cursor">&#9608;</tspan></text>
    </g>

    <text x="56" y="158" class="mono title" font-size="72" font-weight="700" fill="url(#neon)" filter="url(#soft)" letter-spacing="3">KENCYPHER</text>

    <g clip-path="url(#reveal)">
      <text x="58" y="220" class="mono sub">DevOps &#183; System Administration &#183; Automation &#183; Pentesting</text>
    </g>

    <g class="mono pill">
      <g transform="translate(58,246)">
        <rect width="153" height="28" rx="14" fill="#f0cd7a" fill-opacity=".12" stroke="#f0cd7a" stroke-opacity=".55"/>
        <circle cx="18" cy="14" r="4" fill="#f0cd7a" filter="url(#tight)">
          <animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
        <text x="83.5" y="18" text-anchor="middle" fill="#f7dda0">UPTIME 99.9%</text>
      </g>
      <g transform="translate(225,246)">
        <rect width="194" height="28" rx="14" fill="#00e5ff" fill-opacity=".12" stroke="#00e5ff" stroke-opacity=".55"/>
        <circle cx="18" cy="14" r="4" fill="#00e5ff" filter="url(#tight)">
          <animate attributeName="opacity" values="1;.25;1" dur="2.1s" repeatCount="indefinite"/></circle>
        <text x="104" y="18" text-anchor="middle" fill="#85eaff">TUNNELS ENCRYPTED</text>
      </g>
      <g transform="translate(433,246)">
        <rect width="178" height="28" rx="14" fill="#d64358" fill-opacity=".12" stroke="#d64358" stroke-opacity=".55"/>
        <circle cx="18" cy="14" r="4" fill="#d64358" filter="url(#tight)">
          <animate attributeName="opacity" values="1;.25;1" dur="2.6s" repeatCount="indefinite"/></circle>
        <text x="96" y="18" text-anchor="middle" fill="#f2a0ab">APKS SIDELOADED</text>
      </g>
    </g>

    <g stroke="#00e5ff" stroke-opacity=".4" fill="none">
      <path d="M760 96 L850 62 L940 100 L900 176 L800 176 Z"/>
      <path d="M760 96 L900 176 M850 62 L800 176 M940 100 L800 176"/>
    </g>
    <g fill="#00e5ff">
      <circle cx="760" cy="96" r="4.5"><animate attributeName="r" values="4.5;7;4.5" dur="2.4s" repeatCount="indefinite"/></circle>
      <circle cx="850" cy="62" r="4.5" fill="#f0cd7a"><animate attributeName="r" values="4.5;7;4.5" dur="3s" repeatCount="indefinite"/></circle>
      <circle cx="940" cy="100" r="4.5" fill="#8fb4ee"><animate attributeName="r" values="4.5;7;4.5" dur="2.7s" repeatCount="indefinite"/></circle>
      <circle cx="900" cy="176" r="4.5"><animate attributeName="r" values="4.5;7;4.5" dur="3.4s" repeatCount="indefinite"/></circle>
      <circle cx="800" cy="176" r="4.5" fill="#e05068"><animate attributeName="r" values="4.5;7;4.5" dur="2.9s" repeatCount="indefinite"/></circle>
    </g>
    <circle r="3.5" fill="#f5f1e8" filter="url(#tight)">
      <animateMotion dur="5s" repeatCount="indefinite" path="M760 96 L850 62 L940 100 L900 176 L800 176 Z"/>
    </circle>

    <g class="mono" text-anchor="end">
      <text x="958" y="228" class="kv">shell: bash &#183; zsh</text>
      <text x="958" y="246" class="kv">stack: docker &#183; nginx &#183; caddy</text>
      <text x="958" y="264" class="kv">focus: infra hardening</text>
    </g>

    <rect x="0" y="296" width="1000" height="4" fill="url(#neon)"/>
    <rect x="0" y="0" width="1000" height="300" rx="18" fill="none" stroke="#343b4d" stroke-width="1.5"/>
  </g>
</svg>
