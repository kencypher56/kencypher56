<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 200" width="1000" height="200" role="img" aria-label="Delivery pipeline: commit, build, harden, deploy, observe">
  <title>How I ship: commit -&gt; build -&gt; harden -&gt; deploy -&gt; observe</title>
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="100%" stop-color="#10131c"/>
    </linearGradient>
    <linearGradient id="track" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#e8c26a"/>
      <stop offset="30%" stop-color="#00d8f0"/>
      <stop offset="65%" stop-color="#7ea8e8"/>
      <stop offset="100%" stop-color="#d64358"/>
    </linearGradient>
    <filter id="pg" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="pf"><rect x="0" y="0" width="1000" height="200" rx="16"/></clipPath>
    <style>
      .m { font-family:"JetBrains Mono","Fira Code",Consolas,"Courier New",monospace; }
      .st { font-size:14px; fill:#ece6da; font-weight:600; }
      .sd { font-size:11.5px; fill:#6b7689; }
      @keyframes pulse { 0%,100%{ opacity:.35 } 50%{ opacity:1 } }
    </style>
  </defs>

  <g clip-path="url(#pf)">
    <rect width="1000" height="200" fill="url(#pbg)"/>
    <g stroke="#1c2230" stroke-width=".7" opacity=".7">
      <path d="M0 40H1000M0 80H1000M0 120H1000M0 160H1000"/>
    </g>

    <!-- track -->
    <path d="M90 100 H910" stroke="#1c2230" stroke-width="6" stroke-linecap="round" fill="none"/>
    <path d="M90 100 H910" stroke="url(#track)" stroke-width="3" stroke-linecap="round" fill="none"
          stroke-dasharray="14 12" opacity=".85">
      <animate attributeName="stroke-dashoffset" values="0;-260" dur="4s" repeatCount="indefinite"/>
    </path>

    <!-- travelling packets -->
    <circle cy="100" r="5" fill="#e8c26a" filter="url(#pg)">
      <animate attributeName="cx" values="90;910" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cy="100" r="3.5" fill="#00d8f0" filter="url(#pg)">
      <animate attributeName="cx" values="90;910" dur="6s" begin="2s" repeatCount="indefinite"/>
    </circle>
    <circle cy="100" r="3.5" fill="#7ea8e8" filter="url(#pg)">
      <animate attributeName="cx" values="90;910" dur="6s" begin="4s" repeatCount="indefinite"/>
    </circle>

    <!-- stage 1 -->
    <g transform="translate(90,100)">
      <circle r="22" fill="#08090f" stroke="#e8c26a" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#e8c26a" stroke-opacity=".5">
        <animate attributeName="r" values="22;38" dur="3s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".55;0" dur="3s" repeatCount="indefinite"/>
      </circle>
      <text class="m" y="6" text-anchor="middle" font-size="18" fill="#e8c26a">&#9670;</text>
      <text class="m st" y="-42" text-anchor="middle">COMMIT</text>
      <text class="m sd" y="52" text-anchor="middle">git push</text>
    </g>

    <!-- stage 2 -->
    <g transform="translate(295,100)">
      <circle r="22" fill="#08090f" stroke="#00d8f0" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#00d8f0" stroke-opacity=".5">
        <animate attributeName="r" values="22;38" dur="3s" begin=".6s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".55;0" dur="3s" begin=".6s" repeatCount="indefinite"/>
      </circle>
      <g stroke="#00d8f0" stroke-width="1.8" fill="none">
        <rect x="-9" y="-8" width="18" height="16" rx="2"/><path d="M-9 -3H9"/>
      </g>
      <text class="m st" y="-42" text-anchor="middle">BUILD</text>
      <text class="m sd" y="52" text-anchor="middle">docker compose up</text>
    </g>

    <!-- stage 3 -->
    <g transform="translate(500,100)">
      <circle r="22" fill="#08090f" stroke="#d64358" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#d64358" stroke-opacity=".5">
        <animate attributeName="r" values="22;38" dur="3s" begin="1.2s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".55;0" dur="3s" begin="1.2s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -10 L9 -6 V2 C9 8 4 11 0 12 C-4 11 -9 8 -9 2 V-6 Z" fill="none" stroke="#d64358" stroke-width="1.8"/>
      <text class="m st" y="-42" text-anchor="middle">HARDEN</text>
      <text class="m sd" y="52" text-anchor="middle">scan &#183; patch &#183; lock down</text>
    </g>

    <!-- stage 4 -->
    <g transform="translate(705,100)">
      <circle r="22" fill="#08090f" stroke="#7ea8e8" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#7ea8e8" stroke-opacity=".5">
        <animate attributeName="r" values="22;38" dur="3s" begin="1.8s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".55;0" dur="3s" begin="1.8s" repeatCount="indefinite"/>
      </circle>
      <path d="M0 -11 L0 9 M-6 -5 L0 -11 L6 -5" stroke="#7ea8e8" stroke-width="2" fill="none" stroke-linecap="round"/>
      <text class="m st" y="-42" text-anchor="middle">DEPLOY</text>
      <text class="m sd" y="52" text-anchor="middle">caddy &#183; tls &#183; reverse proxy</text>
    </g>

    <!-- stage 5 -->
    <g transform="translate(910,100)">
      <circle r="22" fill="#08090f" stroke="#d9a441" stroke-width="2"/>
      <circle r="30" fill="none" stroke="#d9a441" stroke-opacity=".5">
        <animate attributeName="r" values="22;38" dur="3s" begin="2.4s" repeatCount="indefinite"/>
        <animate attributeName="stroke-opacity" values=".55;0" dur="3s" begin="2.4s" repeatCount="indefinite"/>
      </circle>
      <path d="M-10 4 L-4 4 L-1 -6 L3 8 L6 0 L10 0" stroke="#d9a441" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text class="m st" y="-42" text-anchor="middle">OBSERVE</text>
      <text class="m sd" y="52" text-anchor="middle">logs &#183; uptime</text>
    </g>

    <rect x="0" y="0" width="1000" height="200" rx="16" fill="none" stroke="#2c3243" stroke-width="1.5"/>
  </g>
</svg>
